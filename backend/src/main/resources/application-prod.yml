spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

tool-platform:
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  temporary-file-share:
    storage-provider: ${TEMPORARY_FILE_SHARE_STORAGE_PROVIDER:rustfs}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
  document-conversion:
    worker-base-url: ${DOCUMENT_CONVERSION_WORKER_BASE_URL}
    worker-token: ${DOCUMENT_CONVERSION_WORKER_TOKEN}
