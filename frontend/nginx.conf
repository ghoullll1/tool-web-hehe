limit_req_zone $binary_remote_addr zone=tool_api:10m rate=20r/s;

map $uri $tool_cache_control {
  default                         "no-cache, no-store, must-revalidate";
  ~^/api/                         "";
  ~^/actuator/                    "";
  ~^/(assets|pdfjs)/              "public, max-age=31536000, immutable";
  ~\.mjs$                         "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $tool_cache_control always;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/file-shares {
    client_max_body_size 31m;
    limit_req zone=tool_api burst=8 nodelay;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 60s;
  }

  location = /api/v1/document-conversions {
    client_max_body_size 11m;
    limit_req zone=tool_api burst=4 nodelay;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 150s;
  }

  location /api/ {
    limit_req zone=tool_api burst=40 nodelay;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /ws/v1/temporary-chat {
    limit_req zone=tool_api burst=12 nodelay;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_buffering off;
  }

  location /actuator/health {
    proxy_pass http://backend:8080;
  }

  location /assets/ {
    try_files $uri =404;
    access_log off;
  }

  location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
    access_log off;
  }

  location /pdfjs/ {
    types {
      application/javascript js mjs;
      application/wasm wasm;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    access_log off;
  }

  location = /index.html {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
